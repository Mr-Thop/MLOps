schema: '2.0'
stages:
  data_collection:
    cmd: python src/data_collection.py
    deps:
    - path: src/data_collection.py
      hash: md5
      md5: 64404e8a8e4fe2e14524af4bee02a596
      size: 1790
    params:
      params.yaml:
        data_collection.dataset_name: cifar10
        data_collection.raw_data_dir: data/raw
        data_collection.seed: 42
    outs:
    - path: data/raw
      hash: md5
      md5: fd70a72bb7afc8894d9568cb0266d847.dir
      size: 184380256
      nfiles: 2
  data_processing:
    cmd: python src/data_processing.py
