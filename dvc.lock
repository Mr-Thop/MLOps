      size: 737340828
      nfiles: 7
  feature_selection:
    cmd: python src/feature_selection.py
    deps:
    - path: data/processed
      hash: md5
      md5: be6f2803bf3fde45d98a7de9c29648fd.dir
      size: 737340828
      nfiles: 7
    - path: src/feature_selection.py
      hash: md5
      md5: 4c4366c2f8eed96b3351358f9dfb9880
      size: 2735
    params:
      params.yaml:
        feature_selection.features_dir: data/features
        feature_selection.method: pca
        feature_selection.pca_n_components: 100
        feature_selection.variance_threshold: 0.01
    outs:
    - path: data/features
      hash: md5
      md5: bb19e608480c6f9caff2cecb25a559e1.dir
      size: 24000476
      nfiles: 4
  model_training:
    cmd: python src/model_training.py
    deps:
    - path: data/features
      hash: md5
      md5: bb19e608480c6f9caff2cecb25a559e1.dir
      size: 24000476
      nfiles: 4
    - path: src/model_training.py
      hash: md5
      md5: beff89d949cec57805df4967ad90c74c
      size: 2711
    params:
      params.yaml:
        model_training.activation: relu
        model_training.batch_size: 64
        model_training.dropout_rate: 0.3
        model_training.epochs: 10
        model_training.hidden_units:
        - 256
        - 128
        model_training.learning_rate: 0.001
        model_training.model_type: mlp
        model_training.optimizer: adam
    outs:
    - path: models
      hash: md5
      md5: e8c886f68f4c49493c0dba4fefc72443.dir
