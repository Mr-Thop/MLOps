    params:
      params.yaml:
        model_training.activation: relu
        model_training.batch_size: 128
        model_training.dropout_rate: 0.4
        model_training.epochs: 40
        model_training.hidden_units:
        - 512
        - 256
        model_training.learning_rate: 0.0005
        model_training.model_type: mlp
        model_training.optimizer: rmsprop
