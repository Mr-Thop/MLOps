      hash: md5
      md5: fd70a72bb7afc8894d9568cb0266d847.dir
      size: 184380256
      nfiles: 2
    - path: src/data_processing.py
      hash: md5
      md5: fdb4209bd31fb221ecc502c900121845
      size: 2620
    params:
      params.yaml:
        data_processing.augmentation:
          rotation_range: 15
          horizontal_flip: true
          zoom_range: 0.1
        data_processing.image_size: 32
        data_processing.normalize: true
        data_processing.processed_data_dir: data/processed
        data_processing.test_split: 0.15
        data_processing.validation_split: 0.15
    outs:
    - path: data/processed
      hash: md5
