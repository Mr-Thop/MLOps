data_collection:
  dataset_name: mnist
  raw_data_dir: data/raw
  seed: 42

data_processing:
  image_size: 32
  normalize: true
  validation_split: 0.15
  test_split: 0.15
  augmentation:
    rotation_range: 15
    horizontal_flip: true
    zoom_range: 0.1
  processed_data_dir: data/processed

feature_selection:
  method: pca
  pca_n_components: 200
  variance_threshold: 0.01
  features_dir: data/features

model_training:
  model_type: mlp
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.4
  activation: relu
  optimizer: rmsprop
  learning_rate: 0.0005
  batch_size: 128
  epochs: 40
  model_dir: models

model_evaluation:
  metrics:
  - accuracy
  - precision
  - recall
  - f1_score
  metrics_file: metrics/evaluation.json
  reports_dir: reports
